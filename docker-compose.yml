services:
  mongodb:
    image: mongo:7.0
    container_name: libre-library-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  libre-library:
    build: .
    container_name: libre-library-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - AI_PROVIDER=local
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./models:/app/models
      - ./static/uploads:/app/static/uploads

volumes:
  mongo_data:
