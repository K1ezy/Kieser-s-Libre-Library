<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libre EPUB Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body data-theme="light">
    <!-- Top Navigation Toolbar -->
    <header id="toolbar">
        <div id="toolbar-brand">
            <span>📖</span> Libre Reader
        </div>

        <div class="toolbar-group">
            <div id="google_translate_element"></div>
            
            <button id="annotations-drawer-toggle" class="tool-btn" title="Reading Notes & Highlights (H)">
                <span>📝</span>
                <span>Notes</span>
                <span id="annotations-badge" style="background: var(--accent-color); color: #fff; border-radius: 9999px; padding: 1px 6px; font-size: 10px; font-weight: 700; margin-left: 2px; display: none;">0</span>
            </button>

            <button id="appearance-toggle" class="tool-btn" title="Display & Appearance (Press T to cycle theme)">
                <span style="font-size: 13px; font-weight: 700;">Aa</span>
                <span id="theme-label" style="font-size: 11px; opacity: 0.85;">Light</span>
            </button>
            <button id="fullscreen-btn" class="tool-btn" title="Toggle Fullscreen (F)">⛶</button>
        </div>
    </header>

    <!-- Appearance Settings Popover Modal -->
    <div id="appearance-popover">
        <div>
            <div class="popover-section-label">Reading Theme</div>
            <div class="theme-swatches">
                <button class="theme-swatch swatch-light active" data-theme="light" title="Default Light">Light</button>
                <button class="theme-swatch swatch-sepia" data-theme="sepia" title="Warm Sepia">Sepia</button>
                <button class="theme-swatch swatch-dark" data-theme="dark" title="Slate Dark">Dark</button>
                <button class="theme-swatch swatch-black" data-theme="black" title="OLED Black">Black</button>
            </div>
        </div>

        <div>
            <div class="popover-section-label">Text Size</div>
            <div class="font-size-control">
                <button id="font-dec-btn" class="stepper-btn" title="Decrease Font ( - )">A-</button>
                <span id="font-size-val" style="font-size: 12px; font-weight: 700; font-family: monospace;">16px</span>
                <button id="font-inc-btn" class="stepper-btn" title="Increase Font ( + )">A+</button>
            </div>
        </div>

        <div>
            <div class="popover-section-label">Font Family</div>
            <div class="font-family-group">
                <button class="pill-btn active" data-font="sans" style="font-family: 'Inter', sans-serif;">Sans</button>
                <button class="pill-btn" data-font="serif" style="font-family: 'Merriweather', serif;">Serif</button>
                <button class="pill-btn" data-font="dyslexic" style="font-family: 'Atkinson Hyperlegible', sans-serif;">Dyslexic</button>
            </div>
        </div>

        <div>
            <div class="popover-section-label">Line Spacing</div>
            <div class="line-height-group">
                <button class="pill-btn" data-height="1.4">Compact</button>
                <button class="pill-btn active" data-height="1.65">Default</button>
                <button class="pill-btn" data-height="2.0">Relaxed</button>
            </div>
        </div>
    </div>

    <!-- Active Selection Popover Bar -->
    <div id="selection-popover">
        <div class="popover-row">
            <button class="hl-swatch hl-swatch-yellow" data-color="yellow" title="Yellow Highlight"></button>
            <button class="hl-swatch hl-swatch-green" data-color="green" title="Green Highlight"></button>
            <button class="hl-swatch hl-swatch-blue" data-color="blue" title="Blue Highlight"></button>
            <button class="hl-swatch hl-swatch-pink" data-color="pink" title="Pink Highlight"></button>
            <div class="pop-divider"></div>
            <button id="pop-add-note-btn" class="pop-action-btn" title="Add Note">
                <span>💭</span> Note
            </button>
            <button id="pop-copy-btn" class="pop-action-btn" title="Copy Text">
                <span>📋</span> Copy
            </button>
            <button id="pop-ask-tars-btn" class="pop-action-btn" style="color: var(--accent-color);" title="Ask TARS AI to Explain Passage">
                <span>🤖</span> Explain
            </button>
        </div>
        <div id="pop-note-container" class="note-input-container">
            <textarea id="pop-note-text" class="note-textarea" placeholder="Add private note to this highlight..."></textarea>
            <button id="pop-note-save" class="note-save-btn">Save Note</button>
        </div>
    </div>

    <!-- In-Reader TARS AI Explainer Card -->
    <div id="ai-explainer-card">
        <div class="ai-header">
            <div class="ai-badge">
                <span>🤖</span> TARS Socratic Explainer
            </div>
            <button id="ai-card-close" class="ai-close-btn" title="Close">✕</button>
        </div>
        <div id="ai-card-body" class="ai-body">
            <!-- Dynamic explanation text -->
        </div>
        <div class="ai-footer">
            <button id="ai-attach-note-btn" class="tool-btn" style="display: none;">Attach as Note</button>
            <button id="ai-open-chat-btn" class="tool-btn" style="background: var(--accent-color); color: #fff; border-color: var(--accent-color);">Continue in TARS Chat ↗</button>
        </div>
    </div>

    <!-- Existing Highlight Detail Popover -->
    <div id="highlight-popover">
        <div class="popover-row" style="justify-content: space-between;">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="hl-swatch hl-swatch-yellow" data-update-color="yellow" title="Change to Yellow"></button>
                <button class="hl-swatch hl-swatch-green" data-update-color="green" title="Change to Green"></button>
                <button class="hl-swatch hl-swatch-blue" data-update-color="blue" title="Change to Blue"></button>
                <button class="hl-swatch hl-swatch-pink" data-update-color="pink" title="Change to Pink"></button>
            </div>
            <button id="hl-delete-btn" class="pop-action-btn" style="color: #ef4444;" title="Delete Highlight">
                <span>🗑️</span> Delete
            </button>
        </div>
        <div style="padding-top: 6px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px;">
            <textarea id="hl-edit-note-text" class="note-textarea" placeholder="Edit attached note..."></textarea>
            <button id="hl-save-note-btn" class="note-save-btn">Update Note</button>
        </div>
    </div>

    <!-- Aggregated Annotations Drawer (Sidebar) -->
    <aside id="annotations-drawer">
        <div class="drawer-header">
            <div class="drawer-title">
                <span>📝</span> Notes & Highlights (<span id="drawer-count">0</span>)
            </div>
            <button id="drawer-close-btn" class="ai-close-btn" title="Close Drawer (H)">✕</button>
        </div>
        <div class="drawer-filter-bar">
            <div class="filter-pills">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="yellow">🟡 Yellow</button>
                <button class="filter-pill" data-filter="green">🟢 Green</button>
                <button class="filter-pill" data-filter="blue">🔵 Blue</button>
                <button class="filter-pill" data-filter="pink">🌸 Pink</button>
            </div>
            <input type="text" id="drawer-search" class="drawer-search-input" placeholder="Search highlights & notes..." />
        </div>
        <div id="drawer-cards" class="drawer-cards">
            <!-- Cards populated dynamically -->
        </div>
        <div class="drawer-footer">
            <button id="drawer-export-btn" class="export-btn">
                <span>📥</span> Export Study Guide (Markdown)
            </button>
        </div>
    </aside>

    <!-- Global Toast -->
    <div id="reader-toast"></div>

    <!-- Main Reader Viewport & Bottom Controls -->
    <div id="error-msg"></div>
    <main id="viewer"></main>
    
    <footer id="controls">
        <button id="prev" class="nav-btn">◀ Previous</button>
        <span id="page-info">Loading book coordinates...</span>
        <button id="next" class="nav-btn">Next ▶</button>
    </footer>

    <!-- Google Translate Callback Script -->
    <script>
        function googleTranslateElementInit() {
            try {
                new google.translate.TranslateElement({
                    pageLanguage: 'en', 
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                    autoDisplay: false
                }, 'google_translate_element');
            } catch (e) {
                console.warn("Google Translate initialization skipped:", e);
            }
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    
    <!-- Reader Sub-Modules & Core Controller -->
    <script src="theme.js" defer></script>
    <script src="annotations.js" defer></script>
    <script src="tars.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
