<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libre PDF Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #525659;
            --bg-viewport: #525659;
            --text-body: #0f172a;
            --bg-toolbar: #ffffff;
            --border-color: #e2e8f0;
            --bg-controls: #ffffff;
            --text-controls: #334155;
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover: #f1f5f9;
            --accent-color: #4f46e5;
            --canvas-filter: none;
            --page-bg: #ffffff;
        }

        body[data-theme="light"] {
            --bg-body: #525659;
            --bg-viewport: #525659;
            --text-body: #0f172a;
            --bg-toolbar: #ffffff;
            --border-color: #e2e8f0;
            --bg-controls: #ffffff;
            --text-controls: #334155;
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover: #f1f5f9;
            --accent-color: #4f46e5;
            --canvas-filter: none;
            --page-bg: #ffffff;
        }

        body[data-theme="sepia"] {
            --bg-body: #e8deca;
            --bg-viewport: #e8deca;
            --text-body: #3d2f1d;
            --bg-toolbar: #ede4cf;
            --border-color: #d9c8af;
            --bg-controls: #ede4cf;
            --text-controls: #4a3b2a;
            --btn-bg: #f9f3e5;
            --btn-border: #d4c5ae;
            --btn-hover: #e5dac4;
            --accent-color: #b45309;
            --canvas-filter: sepia(0.38) contrast(0.95);
            --page-bg: #fbf0d9;
        }

        body[data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-viewport: #0f172a;
            --text-body: #e2e8f0;
            --bg-toolbar: #1e293b;
            --border-color: #334155;
            --bg-controls: #1e293b;
            --text-controls: #cbd5e1;
            --btn-bg: #334155;
            --btn-border: #475569;
            --btn-hover: #475569;
            --accent-color: #818cf8;
            --canvas-filter: invert(0.88) hue-rotate(180deg) contrast(0.92);
            --page-bg: #1e293b;
        }

        body[data-theme="black"] {
            --bg-body: #000000;
            --bg-viewport: #000000;
            --text-body: #d1d5db;
            --bg-toolbar: #09090b;
            --border-color: #27272a;
            --bg-controls: #09090b;
            --text-controls: #9ca3af;
            --btn-bg: #18181b;
            --btn-border: #27272a;
            --btn-hover: #27272a;
            --accent-color: #a855f7;
            --canvas-filter: invert(1) contrast(1.05);
            --page-bg: #09090b;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            background-color: var(--bg-body); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        
        /* Top Navigation & Toolbars */
        #toolbar { 
            height: 52px; 
            background: var(--bg-toolbar); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 16px;
            z-index: 100;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        #toolbar-brand { 
            font-weight: 700; 
            color: var(--accent-color); 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn { 
            padding: 6px 12px; 
            border: 1px solid var(--btn-border); 
            background: var(--btn-bg); 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 600;
            color: var(--text-controls); 
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .tool-btn:hover { background: var(--btn-hover); }
        .tool-btn:active { transform: scale(0.98); }

        .page-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-controls);
            font-weight: 600;
        }

        #page-num-input {
            width: 48px;
            padding: 4px 6px;
            border: 1px solid var(--btn-border); 
            background: var(--btn-bg);
            color: var(--text-controls);
            border-radius: 6px; 
            text-align: center; 
            font-size: 12px; 
            font-weight: 700;
        }
        #page-num-input:focus {
            outline: 2px solid var(--accent-color); 
            border-color: transparent; 
        }

        /* Document Scroll Viewport */
        #viewer-container { 
            flex: 1; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            overflow-x: auto; 
            position: relative; 
            padding: 24px 16px;
            scroll-behavior: smooth;
            background-color: var(--bg-viewport);
            transition: background-color 0.2s ease;
        }

        #pdf-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 100%;
        }

        .page-container {
            background-color: var(--page-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            position: relative;
            border-radius: 4px;
            transition: box-shadow 0.2s ease;
            overflow: hidden;
        }

        .page-container.active-page {
            box-shadow: 0 0 0 2px var(--accent-color), 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        canvas {
            display: block;
            border-radius: 4px;
            filter: var(--canvas-filter);
            transition: filter 0.2s ease;
        }

        .page-loading-skeleton {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-controls);
            opacity: 0.6;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-toolbar);
            border: 1px dashed var(--border-color);
            border-radius: 4px;
        }

        /* Bottom Controls */
        #controls { 
            height: 48px; 
            background: var(--bg-controls); 
            border-top: 1px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 16px; 
            z-index: 10; 
            transition: all 0.2s ease;
        }
        
        #page-info { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-controls); 
            font-family: monospace; 
        }

        #error-msg { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: #991b1b; 
            background-color: #fee2e2; 
            border: 1px solid #fecaca; 
            padding: 18px; 
            border-radius: 12px; 
            display: none; 
            z-index: 100; 
            font-size: 13px; 
            max-width: 80%; 
            text-align: center; 
        }

        /* Loading Spinner */
        #initial-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            z-index: 50;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Appearance Popover Dropdown */
        #appearance-popover {
            position: absolute;
            top: 56px;
            right: 16px;
            width: 280px;
            background: var(--bg-toolbar);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 200;
            backdrop-filter: blur(8px);
        }

        .popover-section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-controls);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .theme-swatches {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .theme-swatch {
            height: 38px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.15s ease;
        }
        .theme-swatch:hover { transform: translateY(-1px); }
        .theme-swatch.active { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }
        .swatch-light { background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; }
        .swatch-sepia { background: #f4ecd8; color: #3d2f1d; border: 1px solid #d4c5ae; }
        .swatch-dark { background: #1e293b; color: #e2e8f0; }
        .swatch-black { background: #000000; color: #ffffff; border: 1px solid #333; }
    </style>
    
    <!-- PDF.js from Cloudflare CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-theme="light">
    <div id="toolbar">
        <div id="toolbar-brand">
            <span>📄</span> Libre PDF Reader
        </div>

        <div class="toolbar-group">
            <div class="page-input-wrapper">
                <span>Page</span>
                <input type="number" id="page-num-input" min="1" value="1" />
                <span id="page-count-display">of --</span>
            </div>
        </div>

        <div class="toolbar-group">
            <button id="zoom-out" class="tool-btn" title="Zoom Out ( - )">－</button>
            <button id="zoom-reset" class="tool-btn" title="Fit Width">Fit</button>
            <button id="zoom-in" class="tool-btn" title="Zoom In ( + )">＋</button>

            <button id="appearance-toggle" class="tool-btn" title="Appearance Settings (Press T to cycle theme)">
                <span style="font-size: 13px; font-weight: 700;">Aa</span>
                <span id="theme-label" style="font-size: 11px; opacity: 0.85;">Light</span>
            </button>
            <button id="fullscreen-btn" class="tool-btn" title="Toggle Fullscreen (F)">⛶</button>
        </div>
    </div>

    <!-- Appearance Settings Popover Modal -->
    <div id="appearance-popover">
        <div>
            <div class="popover-section-label">Reading Theme</div>
            <div class="theme-swatches">
                <button class="theme-swatch swatch-light active" data-theme="light" title="Default Light">Light</button>
                <button class="theme-swatch swatch-sepia" data-theme="sepia" title="Warm Sepia">Sepia</button>
                <button class="theme-swatch swatch-dark" data-theme="dark" title="Slate Dark">Dark</button>
                <button class="theme-swatch swatch-black" data-theme="black" title="OLED Black">Black</button>
            </div>
        </div>

        <div>
            <div class="popover-section-label">Magnification</div>
            <div style="display: flex; gap: 6px;">
                <button id="pop-zoom-out" class="tool-btn" style="flex: 1;">Zoom Out</button>
                <button id="pop-zoom-fit" class="tool-btn" style="flex: 1;">Fit Width</button>
                <button id="pop-zoom-in" class="tool-btn" style="flex: 1;">Zoom In</button>
            </div>
        </div>
    </div>

    <div id="error-msg"></div>

    <div id="initial-loader">
        <div class="spinner"></div>
        <span>Loading document...</span>
    </div>

    <div id="viewer-container">
        <div id="pdf-viewer"></div>
    </div>
    
    <div id="controls">
        <button id="prev" class="tool-btn">◀ Previous</button>
        <span id="page-info">Loading PDF coordinates...</span>
        <button id="next" class="tool-btn">Next ▶</button>
    </div>

    <script>
        (function() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');
            const bookId = urlParams.get('book_id') || '';
            const userId = urlParams.get('user_id') || 'guest';
            const initialPage = Math.max(1, parseInt(urlParams.get('page') || '1', 10));
            const paramTotal = parseInt(urlParams.get('total') || '0', 10);

            const viewerContainer = document.getElementById('viewer-container');
            const pdfViewer = document.getElementById('pdf-viewer');
            const errorDiv = document.getElementById('error-msg');
            const pageInfoSpan = document.getElementById('page-info');
            const pageNumInput = document.getElementById('page-num-input');
            const pageCountDisplay = document.getElementById('page-count-display');
            const loaderDiv = document.getElementById('initial-loader');
            const appearanceBtn = document.getElementById('appearance-toggle');
            const appearancePopover = document.getElementById('appearance-popover');
            const themeLabel = document.getElementById('theme-label');
            const fullscreenBtn = document.getElementById('fullscreen-btn');

            if (!fileUrl) {
                if (loaderDiv) loaderDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error: No PDF document specified in query parameters.";
                return;
            }

            let pdfDoc = null;
            let totalPages = paramTotal > 0 ? paramTotal : 1;
            let currentPage = initialPage;
            let lastNotifiedPage = initialPage;
            let currentScale = 1.25;
            let isRestoring = (initialPage > 1);
            let renderedPages = new Set();
            let pageContainers = [];
            let saveDebounceTimer = null;
            let pendingSavePayload = null;

            // Appearance State from localStorage
            let currentTheme = localStorage.getItem('libre_reader_theme') || 'light';

            function applyTheme(theme, save = true) {
                currentTheme = theme;
                document.body.setAttribute('data-theme', theme);
                if (themeLabel) {
                    themeLabel.innerText = theme.charAt(0).toUpperCase() + theme.slice(1);
                }

                // Update swatch active classes
                document.querySelectorAll('.theme-swatch').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
                });

                if (save) {
                    localStorage.setItem('libre_reader_theme', theme);
                    notifyParentAppearance();
                }
            }

            function cycleTheme() {
                const themes = ['light', 'sepia', 'dark', 'black'];
                const nextIdx = (themes.indexOf(currentTheme) + 1) % themes.length;
                applyTheme(themes[nextIdx], true);
            }

            function notifyParentAppearance() {
                try {
                    window.parent.postMessage({
                        type: 'LIBRE_READER_THEME_CHANGE',
                        theme: currentTheme
                    }, '*');
                } catch(e) {}
            }

            // Set initial theme
            applyTheme(currentTheme, false);

            function calculatePercentage(page, total) {
                if (total <= 1) return 100.0;
                return Math.max(0.0, Math.min(100.0, Math.round(((page - 1) / (total - 1)) * 1000) / 10));
            }

            function updateHud(page, total) {
                const pct = calculatePercentage(page, total);
                if (pageInfoSpan) {
                    pageInfoSpan.innerText = `Page ${page} of ${total} (${pct}%)`;
                }
                if (pageNumInput) {
                    pageNumInput.value = page;
                }
                if (pageCountDisplay) {
                    pageCountDisplay.innerText = `of ${total}`;
                }

                try {
                    window.parent.postMessage({
                        type: 'LIBRE_READER_PROGRESS',
                        book_id: bookId,
                        current_page: page,
                        total_pages: total,
                        percentage: pct,
                        theme: currentTheme
                    }, '*');
                } catch (err) {
                    console.warn("[PDF Engine] postMessage to parent failed:", err);
                }
            }

            function scheduleSave(payload) {
                pendingSavePayload = {
                    ...payload,
                    theme: currentTheme
                };
                if (saveDebounceTimer) {
                    clearTimeout(saveDebounceTimer);
                }
                saveDebounceTimer = setTimeout(() => {
                    persistReadingProgress(pendingSavePayload);
                }, 500);
            }

            async function persistReadingProgress(payload) {
                if (!payload || !payload.book_id) return;
                try {
                    const response = await fetch('/api/progress/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        console.log(`[PDF Engine] Persisted progress: page ${payload.current_page}/${payload.total_pages} (${payload.progress_percent}%) theme=${payload.theme}`);
                    }
                } catch (err) {
                    console.error("[PDF Engine] Network error during progress save:", err);
                }
            }

            function flushPendingSave() {
                if (pendingSavePayload) {
                    const payloadString = JSON.stringify(pendingSavePayload);
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon('/api/progress/sync', new Blob([payloadString], { type: 'application/json' }));
                    } else {
                        fetch('/api/progress/sync', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: payloadString,
                            keepalive: true
                        });
                    }
                    pendingSavePayload = null;
                }
            }

            window.addEventListener('beforeunload', flushPendingSave);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') flushPendingSave();
            });

            function onActivePageChanged(newPage) {
                if (newPage < 1 || newPage > totalPages) return;
                currentPage = newPage;

                pageContainers.forEach((c, idx) => {
                    if (idx + 1 === newPage) {
                        c.classList.add('active-page');
                    } else {
                        c.classList.remove('active-page');
                    }
                });

                updateHud(newPage, totalPages);

                if (isRestoring) {
                    console.log(`[PDF Engine] Restoration verified at page ${newPage}/${totalPages}`);
                    isRestoring = false;
                    lastNotifiedPage = newPage;
                    return;
                }

                if (newPage === lastNotifiedPage) return;
                lastNotifiedPage = newPage;

                const pct = calculatePercentage(newPage, totalPages);
                scheduleSave({
                    book_id: bookId,
                    user_id: userId,
                    current_page: newPage,
                    total_pages: totalPages,
                    progress_percent: pct,
                    status: (newPage >= totalPages && totalPages > 1) ? 'completed' : 'reading',
                    client_timestamp: Date.now() / 1000
                });
            }

            function scrollToPage(pageNum, smooth = true) {
                pageNum = Math.max(1, Math.min(totalPages, pageNum));
                const target = document.getElementById(`page-container-${pageNum}`);
                if (target) {
                    target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
                    onActivePageChanged(pageNum);
                }
            }

            window.addEventListener('message', function(event) {
                if (!event.data) return;
                if (event.data.type === 'READER_NAVIGATE') {
                    if (event.data.action === 'next') {
                        scrollToPage(currentPage + 1);
                    } else if (event.data.action === 'prev') {
                        scrollToPage(currentPage - 1);
                    }
                } else if (event.data.type === 'SET_THEME') {
                    if (event.data.theme) applyTheme(event.data.theme, true);
                }
            });

            // Popover event handling
            if (appearanceBtn && appearancePopover) {
                appearanceBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = appearancePopover.style.display === 'flex';
                    appearancePopover.style.display = isVisible ? 'none' : 'flex';
                });

                document.addEventListener('click', (e) => {
                    if (appearancePopover && !appearancePopover.contains(e.target) && e.target !== appearanceBtn) {
                        appearancePopover.style.display = 'none';
                    }
                });
            }

            document.querySelectorAll('.theme-swatch').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyTheme(btn.getAttribute('data-theme'), true);
                });
            });

            // Fullscreen Button
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                });
            }

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'k') {
                    scrollToPage(currentPage + 1);
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'j') {
                    scrollToPage(currentPage - 1);
                    e.preventDefault();
                } else if (e.key === 't' || e.key === 'T') {
                    cycleTheme();
                    e.preventDefault();
                } else if (e.key === '+' || e.key === '=') {
                    currentScale = Math.min(3.0, currentScale + 0.25);
                    rebuildLayout();
                    e.preventDefault();
                } else if (e.key === '-' || e.key === '_') {
                    currentScale = Math.max(0.6, currentScale - 0.25);
                    rebuildLayout();
                    e.preventDefault();
                } else if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                    e.preventDefault();
                } else if (e.key === 'Escape') {
                    if (appearancePopover) appearancePopover.style.display = 'none';
                }
            });

            // Toolbar buttons
            const nextBtn = document.getElementById('next');
            const prevBtn = document.getElementById('prev');
            if (nextBtn) nextBtn.addEventListener('click', () => scrollToPage(currentPage + 1));
            if (prevBtn) prevBtn.addEventListener('click', () => scrollToPage(currentPage - 1));

            // Page number direct jump
            if (pageNumInput) {
                pageNumInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const target = parseInt(pageNumInput.value, 10);
                        if (!isNaN(target)) {
                            scrollToPage(target);
                        }
                    }
                });
            }

            // Zoom handlers
            function handleZoomIn() {
                currentScale = Math.min(3.0, currentScale + 0.25);
                rebuildLayout();
            }
            function handleZoomOut() {
                currentScale = Math.max(0.6, currentScale - 0.25);
                rebuildLayout();
            }

            document.getElementById('zoom-in').addEventListener('click', handleZoomIn);
            document.getElementById('zoom-out').addEventListener('click', handleZoomOut);
            document.getElementById('zoom-reset').addEventListener('click', fitToWidth);

            const popZoomIn = document.getElementById('pop-zoom-in');
            const popZoomOut = document.getElementById('pop-zoom-out');
            const popZoomFit = document.getElementById('pop-zoom-fit');
            if (popZoomIn) popZoomIn.addEventListener('click', handleZoomIn);
            if (popZoomOut) popZoomOut.addEventListener('click', handleZoomOut);
            if (popZoomFit) popZoomFit.addEventListener('click', fitToWidth);

            function fitToWidth() {
                if (!pageContainers.length || !pdfDoc) return;
                pdfDoc.getPage(1).then(page => {
                    const viewport = page.getViewport({ scale: 1.0 });
                    const containerWidth = viewerContainer.clientWidth - 48;
                    currentScale = Math.max(0.5, containerWidth / viewport.width);
                    rebuildLayout();
                });
            }

            async function renderPageCanvas(pageNum, container) {
                if (renderedPages.has(pageNum)) return;
                renderedPages.add(pageNum);

                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: currentScale });
                    const outputScale = window.devicePixelRatio || 1;

                    container.innerHTML = '';
                    container.style.width = `${Math.floor(viewport.width)}px`;
                    container.style.height = `${Math.floor(viewport.height)}px`;

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    canvas.style.width = `${Math.floor(viewport.width)}px`;
                    canvas.style.height = `${Math.floor(viewport.height)}px`;

                    container.appendChild(canvas);

                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport,
                        transform: transform
                    }).promise;
                } catch (err) {
                    console.error(`[PDF Engine] Error rendering page ${pageNum}:`, err);
                }
            }

            let renderObserver = null;
            let scrollDebounceTimer = null;

            function setupObservers() {
                if (renderObserver) renderObserver.disconnect();

                renderObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const pageNum = parseInt(entry.target.getAttribute('data-page-number'), 10);
                        if (entry.isIntersecting) {
                            renderPageCanvas(pageNum, entry.target);
                        }
                    });
                }, {
                    root: viewerContainer,
                    rootMargin: '300px 0px 300px 0px'
                });

                pageContainers.forEach(container => {
                    renderObserver.observe(container);
                });

                viewerContainer.addEventListener('scroll', () => {
                    if (scrollDebounceTimer) cancelAnimationFrame(scrollDebounceTimer);
                    scrollDebounceTimer = requestAnimationFrame(checkActivePageFromScroll);
                }, { passive: true });
            }

            function checkActivePageFromScroll() {
                if (!pageContainers.length) return;
                const containerRect = viewerContainer.getBoundingClientRect();
                const viewportCenter = containerRect.top + containerRect.height / 3;

                let bestPage = currentPage;
                let minDistance = Infinity;

                pageContainers.forEach(container => {
                    const rect = container.getBoundingClientRect();
                    const pageTop = rect.top;
                    const dist = Math.abs(pageTop - viewportCenter);
                    if (dist < minDistance) {
                        minDistance = dist;
                        bestPage = parseInt(container.getAttribute('data-page-number'), 10);
                    }
                });

                if (bestPage !== currentPage) {
                    onActivePageChanged(bestPage);
                }
            }

            function rebuildLayout() {
                renderedPages.clear();
                pdfViewer.innerHTML = '';
                pageContainers = [];

                if (!pdfDoc) return;

                pdfDoc.getPage(1).then(firstPage => {
                    const viewport = firstPage.getViewport({ scale: currentScale });
                    const estWidth = Math.floor(viewport.width);
                    const estHeight = Math.floor(viewport.height);

                    for (let i = 1; i <= totalPages; i++) {
                        const container = document.createElement('div');
                        container.className = 'page-container';
                        container.id = `page-container-${i}`;
                        container.setAttribute('data-page-number', i);
                        container.style.width = `${estWidth}px`;
                        container.style.minHeight = `${estHeight}px`;

                        const skeleton = document.createElement('div');
                        skeleton.className = 'page-loading-skeleton';
                        skeleton.style.width = `${estWidth}px`;
                        skeleton.style.height = `${estHeight}px`;
                        skeleton.innerText = `Page ${i}`;
                        container.appendChild(skeleton);

                        pdfViewer.appendChild(container);
                        pageContainers.push(container);
                    }

                    setupObservers();
                    scrollToPage(currentPage, false);
                });
            }

            const loadingTask = pdfjsLib.getDocument({
                url: fileUrl,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true
            });

            loadingTask.promise.then(async function(loadedDoc) {
                pdfDoc = loadedDoc;
                totalPages = pdfDoc.numPages;
                console.log(`[PDF Engine] Document loaded successfully. Total pages: ${totalPages}`);

                if (loaderDiv) loaderDiv.style.display = 'none';

                updateHud(currentPage, totalPages);

                const firstPage = await pdfDoc.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.0 });
                const containerWidth = viewerContainer.clientWidth - 48;
                if (containerWidth > 0 && viewport.width > 0) {
                    currentScale = Math.max(0.6, Math.min(2.0, containerWidth / viewport.width));
                }

                rebuildLayout();

                if (initialPage > 1) {
                    console.log(`[PDF Engine] Restoring saved page coordinate: ${initialPage}`);
                    setTimeout(() => {
                        scrollToPage(initialPage, false);
                    }, 100);
                } else {
                    onActivePageChanged(1);
                }
            }).catch(function(error) {
                console.error("[PDF Engine] Error loading PDF:", error);
                if (loaderDiv) loaderDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Error loading PDF document: " + error.message;
            });

        })();
    </script>
</body>
</html>
