<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libre PDF Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.0.2">
    
    <!-- PDF.js from Cloudflare CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-theme="light">
    <!-- Top Reader Navigation Bar -->
    <div id="toolbar" role="toolbar" aria-label="PDF Reader Controls">
        <div id="toolbar-brand">
            <span>📄</span> Libre PDF Reader
        </div>

        <div class="toolbar-group">
            <div class="page-input-wrapper">
                <span>Page</span>
                <input type="number" id="page-num-input" min="1" value="1" aria-label="Page number" />
                <span id="page-count-display">of --</span>
            </div>
        </div>

        <div class="toolbar-group">
            <button id="zoom-out" class="tool-btn" title="Zoom Out ( - )" aria-label="Zoom Out">－</button>
            <button id="zoom-reset" class="tool-btn" title="Fit Width" aria-label="Fit Width">Fit</button>
            <button id="zoom-in" class="tool-btn" title="Zoom In ( + )" aria-label="Zoom In">＋</button>

            <button id="annotations-drawer-toggle" class="tool-btn" title="Reading Notes & Highlights (H)" aria-label="Toggle Notes & Highlights">
                <span>📝</span>
                <span>Notes</span>
                <span id="annotations-badge" style="background: var(--accent-color); color: #fff; border-radius: 9999px; padding: 1px 6px; font-size: 10px; font-weight: 700; margin-left: 2px;">0</span>
            </button>

            <button id="appearance-toggle" class="tool-btn" title="Appearance Settings (Press T to cycle theme)" aria-label="Appearance Settings">
                <span style="font-size: 13px; font-weight: 700;">Aa</span>
                <span id="theme-label" style="font-size: 11px; opacity: 0.85;">Light</span>
            </button>
            <button id="fullscreen-btn" class="tool-btn" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">⛶</button>
        </div>
    </div>

    <!-- Appearance Settings Popover Modal -->
    <div id="appearance-popover" role="dialog" aria-label="Appearance Settings">
        <div>
            <div class="popover-section-label">Reading Theme</div>
            <div class="theme-swatches">
                <button class="theme-swatch swatch-light active" data-theme="light" title="Default Light">Light</button>
                <button class="theme-swatch swatch-sepia" data-theme="sepia" title="Warm Sepia">Sepia</button>
                <button class="theme-swatch swatch-dark" data-theme="dark" title="Slate Dark">Dark</button>
                <button class="theme-swatch swatch-black" data-theme="black" title="OLED Black">Black</button>
            </div>
        </div>

        <div>
            <div class="popover-section-label">Magnification</div>
            <div style="display: flex; gap: 6px;">
                <button id="pop-zoom-out" class="tool-btn" style="flex: 1;">Zoom Out</button>
                <button id="pop-zoom-fit" class="tool-btn" style="flex: 1;">Fit Width</button>
                <button id="pop-zoom-in" class="tool-btn" style="flex: 1;">Zoom In</button>
            </div>
        </div>
    </div>

    <!-- Floating Text Selection Popover -->
    <div id="selection-popover" role="toolbar" aria-label="Annotation Popover">
        <div class="popover-row">
            <button class="hl-swatch hl-swatch-yellow" data-color="yellow" title="Highlight Yellow" aria-label="Highlight Yellow"></button>
            <button class="hl-swatch hl-swatch-green" data-color="green" title="Highlight Green" aria-label="Highlight Green"></button>
            <button class="hl-swatch hl-swatch-blue" data-color="blue" title="Highlight Blue" aria-label="Highlight Blue"></button>
            <button class="hl-swatch hl-swatch-pink" data-color="pink" title="Highlight Pink" aria-label="Highlight Pink"></button>
            <div class="pop-divider"></div>
            <button id="pop-add-note-btn" class="pop-action-btn" title="Add Sticky Note">
                <span>✏️</span> Note
            </button>
            <button id="pop-copy-btn" class="pop-action-btn" title="Copy Quote with Citation">
                <span>📋</span> Copy
            </button>
            <button id="pop-ask-tars-btn" class="pop-action-btn" style="color: var(--accent-color);" title="Ask TARS AI Explainer">
                <span>🤖</span> Ask TARS
            </button>
        </div>
        <div id="pop-note-container" class="note-input-container">
            <textarea id="pop-note-text" class="note-textarea" placeholder="Add study note or reflection..."></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 10px; color: var(--text-controls);">Press Save to persist</span>
                <button id="pop-note-save" class="note-save-btn">Save Note</button>
            </div>
        </div>
    </div>

    <!-- In-Reader TARS AI Explainer Bubble -->
    <div id="ai-explainer-card" role="dialog" aria-label="TARS AI Explainer">
        <div class="ai-header">
            <div class="ai-badge">
                <span>🤖</span> TARS Socratic Explainer
            </div>
            <button id="ai-card-close" class="ai-close-btn" title="Close" aria-label="Close">✕</button>
        </div>
        <div id="ai-card-body" class="ai-body">
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 0; color: var(--text-controls);">
                <div style="width: 14px; height: 14px; border: 2px solid var(--accent-color); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <span>Analyzing passage with TARS AI...</span>
            </div>
        </div>
        <div class="ai-footer">
            <button id="ai-attach-note-btn" class="tool-btn" style="display: none;">Attach as Note</button>
            <button id="ai-open-chat-btn" class="tool-btn" style="background: var(--accent-color); color: #fff; border-color: var(--accent-color);">Continue in TARS Chat ↗</button>
        </div>
    </div>

    <!-- Existing Highlight Detail Popover -->
    <div id="highlight-popover" role="dialog" aria-label="Edit Highlight">
        <div class="popover-row" style="justify-content: space-between;">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="hl-swatch hl-swatch-yellow" data-update-color="yellow" title="Change to Yellow" aria-label="Yellow"></button>
                <button class="hl-swatch hl-swatch-green" data-update-color="green" title="Change to Green" aria-label="Green"></button>
                <button class="hl-swatch hl-swatch-blue" data-update-color="blue" title="Change to Blue" aria-label="Blue"></button>
                <button class="hl-swatch hl-swatch-pink" data-update-color="pink" title="Change to Pink" aria-label="Pink"></button>
            </div>
            <button id="hl-delete-btn" class="pop-action-btn" style="color: #ef4444;" title="Delete Highlight">
                <span>🗑️</span> Delete
            </button>
        </div>
        <div style="padding-top: 6px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px;">
            <textarea id="hl-edit-note-text" class="note-textarea" placeholder="Edit attached note..."></textarea>
            <button id="hl-save-note-btn" class="note-save-btn">Update Note</button>
        </div>
    </div>

    <!-- Aggregated Annotations Drawer (Sidebar) -->
    <aside id="annotations-drawer" role="complementary" aria-label="Notes and Highlights">
        <div class="drawer-header">
            <div class="drawer-title">
                <span>📝</span> Notes & Highlights (<span id="drawer-count">0</span>)
            </div>
            <button id="drawer-close-btn" class="ai-close-btn" title="Close Drawer (H)" aria-label="Close Drawer">✕</button>
        </div>
        <div class="drawer-filter-bar">
            <div class="filter-pills">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="yellow">🟡 Yellow</button>
                <button class="filter-pill" data-filter="green">🟢 Green</button>
                <button class="filter-pill" data-filter="blue">🔵 Blue</button>
                <button class="filter-pill" data-filter="pink">🌸 Pink</button>
            </div>
            <input type="text" id="drawer-search" class="drawer-search-input" placeholder="Search highlights & notes..." aria-label="Search notes" />
        </div>
        <div id="drawer-cards" class="drawer-cards">
            <!-- Cards populated dynamically -->
        </div>
        <div class="drawer-footer">
            <button id="drawer-export-btn" class="export-btn">
                <span>📥</span> Export Study Guide (Markdown)
            </button>
        </div>
    </aside>

    <!-- Global Toast Notification -->
    <div id="reader-toast" role="status" aria-live="polite"></div>

    <!-- Error Display -->
    <div id="error-msg" role="alert"></div>

    <!-- Initial Loading State -->
    <div id="initial-loader">
        <div class="spinner"></div>
        <span>Loading document...</span>
    </div>

    <!-- Main PDF Viewport Container -->
    <main id="viewer-container">
        <div id="pdf-viewer"></div>
    </main>
    
    <!-- Bottom Floating Pagination Controls -->
    <nav id="controls" aria-label="Page Navigation">
        <button id="prev" class="tool-btn">◀ Previous</button>
        <span id="page-info">Loading PDF coordinates...</span>
        <button id="next" class="tool-btn">Next ▶</button>
    </nav>

    <!-- Reader Sub-Modules & Application Logic -->
    <script src="theme.js?v=2.0.2" defer></script>
    <script src="annotations.js?v=2.0.2" defer></script>
    <script src="tars.js?v=2.0.2" defer></script>
    <script src="script.js?v=2.0.2" defer></script>
</body>
</html>
